<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#0c0907}
body{width:1920px;font-family:Inter,system-ui,sans-serif;color:#f0e8dd;padding:56px 64px 60px;box-sizing:border-box;
 background:radial-gradient(70% 40% at 50% 0%, rgba(202,165,96,.12), rgba(12,9,7,0) 70%),#0c0907}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:44px;padding:0 6px}
.head h1{font-family:Georgia,Gelasio,serif;font-size:34px;margin:0;font-weight:700;letter-spacing:-.3px}
.head h1 span{color:#caa560}
.head p{margin:8px 0 0;color:#8d7b66;font-size:16px}
.head .tag{font-family:Georgia,Gelasio,serif;letter-spacing:4px;color:#e0c48a;font-size:14px;font-weight:700}
.row{display:flex;justify-content:space-between}
.phone{display:flex;flex-direction:column;align-items:center;gap:22px}
.frame{width:390px;height:844px;padding:10px;border-radius:58px;background:linear-gradient(160deg,#3a3026,#15100c 40%,#2a221a);
 box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(224,196,138,.22),inset 0 0 0 1px rgba(255,255,255,.06)}
.frame .scr{width:390px;height:844px;border-radius:48px;overflow:hidden;position:relative}
.frame img{width:390px;height:844px;display:block}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000}
.lab{text-align:center}
.lab b{display:block;font-size:17px;font-weight:650}
.lab span{display:block;color:#8d7b66;font-size:14px;margin-top:4px}
.lab i{font-style:normal;color:#caa560;font-family:Georgia,Gelasio,serif;font-weight:700;margin-right:8px}
</style></head><body>
<div class="head"><div><h1>MafitaPay <span>·</span> Login &amp; Register redesign</h1><p>Mobile · 390×844 · dark gold theme</p></div><div class="tag">MAFITAPAY</div></div>
<div class="row">
 <div class="phone"><div class="frame"><div class="scr"><img src="../01-login.png"><div class="island"></div></div></div><div class="lab"><b><i>01</i>Login</b><span>Welcome back · password + fingerprint</span></div></div>
 <div class="phone"><div class="frame"><div class="scr"><img src="../02-register-step1.png"><div class="island"></div></div></div><div class="lab"><b><i>02</i>Register · Step 1</b><span>Details, referral, inline error</span></div></div>
 <div class="phone"><div class="frame"><div class="scr"><img src="../03-register-step2.png"><div class="island"></div></div></div><div class="lab"><b><i>03</i>Register · Step 2</b><span>Password strength &amp; terms</span></div></div>
 <div class="phone"><div class="frame"><div class="scr"><img src="../04-check-email.png"><div class="island"></div></div></div><div class="lab"><b><i>04</i>Check your email</b><span>Success, resend countdown</span></div></div>
</div></body></html>
