<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0907" />
    <title>MafitaPay</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c0907;
        color: #f0e8dd;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }

      .shell {
        text-align: center;
        padding: 2rem;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 1rem;
        border-radius: 18px;
        object-fit: contain;
        background: #18130f;
      }

      .title {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #e0c48a;
      }

      .detail {
        margin-top: 0.75rem;
        font-size: 0.9rem;
        color: #c5b7a3;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <img class="logo" src="mafitapay-logo.png" alt="MafitaPay logo" />
      <div class="title">MafitaPay</div>
      <p class="detail">Opening your wallet…</p>
    </div>
    <script>
      const target = 'https://mafitapay.com'
      const destination =
        target +
        window.location.pathname +
        window.location.search +
        window.location.hash
      window.location.replace(destination)
    </script>
  </body>
</html>
